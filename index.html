<style>
:root{--bg:#070b1a;--g1:#0f1c4d;--card:rgba(18,28,66,.62);--solid:#111a3d;--tx:#eef2ff;--mu:#9aa6cf;--bd:rgba(150,170,255,.16);--pr:#3b82f6;--pr2:#60a5fa;--gold:#e0b04b;--ok:#34d399;--er:#fb7185}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 20% 10%,#1d3a9a55,transparent),radial-gradient(50% 45% at 85% 90%,#e0b04b22,transparent),var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:#2447c9;top:-80px;left:-60px}
.bg i:nth-child(2){width:300px;height:300px;background:#6d28d9;bottom:-90px;right:-40px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,50px) scale(1.15)}}
.wrap{max-width:1080px;margin:0 auto;padding:18px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.glass{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 60px #0007}
.in{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
/* login */
.auth{min-height:100svh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:420px;padding:30px 26px}
.logo{width:116px;height:116px;display:block;margin:0 auto 14px;border-radius:50%;filter:drop-shadow(0 0 22px #e0b04b66);animation:pop 1s ease both,glow 4s ease-in-out infinite alternate}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}}
@keyframes glow{to{filter:drop-shadow(0 0 34px #e0b04b77)}}
h1{font-size:1.35rem;text-align:center;margin:0;letter-spacing:.2px}
.caps{letter-spacing:1.5px;font-size:1.25rem}.lms{color:var(--gold);font-weight:700;letter-spacing:4px;font-size:.85rem}
.sub{text-align:center;color:var(--mu);font-size:.88rem;margin:4px 0 22px}
.fld{position:relative;margin-bottom:14px}
.fld input,.fld select{width:100%;padding:20px 44px 8px 14px;border-radius:12px;border:1px solid var(--bd);background:#0a1230aa;color:var(--tx);font-size:1rem;outline:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--pr2);box-shadow:0 0 0 4px #3b82f633}
.fld label{position:absolute;left:14px;top:16px;color:var(--mu);font-size:.95rem;pointer-events:none;transition:.18s;transform-origin:left}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld select+label{top:6px;font-size:.72rem;color:var(--pr2)}
.eye{position:absolute;right:6px;top:8px;background:none;border:0;color:var(--mu);padding:8px;cursor:pointer;font-size:1rem}
.btn{border:0;cursor:pointer;font-size:.97rem;font-weight:600;padding:13px 16px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6 55%,#6366f1);box-shadow:0 8px 22px #2563eb55;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px #2563eb77}.btn:active{transform:none}
.btn.full{width:100%}.btn.ghost{background:#ffffff0d;box-shadow:none;border:1px solid var(--bd);color:var(--tx)}
.btn.red{background:linear-gradient(135deg,#e11d48,#fb7185);box-shadow:none}.btn.sm{padding:7px 11px;font-size:.8rem;border-radius:9px}
.btn[disabled]{opacity:.6;pointer-events:none}
.sw{text-align:center;margin-top:18px;color:var(--mu);font-size:.9rem}
.sw a{color:var(--gold);cursor:pointer;font-weight:600}
.err{color:var(--er);font-size:.85rem;min-height:1.1em;margin:2px 0 10px;text-align:center}
.hint{font-size:.76rem;color:var(--mu);text-align:center;margin-top:16px;opacity:.8}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px}
.bar img{width:46px;height:46px;border-radius:50%}
.bar b{display:block;font-size:1rem}.bar small{color:var(--mu)}.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px}.stat b{font-size:1.8rem;display:block;background:linear-gradient(135deg,#fff,var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mu);font-size:.8rem}
.tabs{display:flex;gap:6px;padding:6px;margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mu);padding:9px 16px;border-radius:14px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,#2563eb,#6366f1);color:#fff}
.panel{padding:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools .fld{flex:1;min-width:200px;margin:0}
.tools .fld input{padding:14px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}

const K="to_db_v1",S="to_session_v1";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={};
const sget=(st,k)=>{try{return window[st].getItem(k)}catch{return mem[st+k]??null}};
const sset=(st,k,v)=>{try{window[st].setItem(k,v)}catch{mem[st+k]=v}};
const sdel=(st,k)=>{try{window[st].removeItem(k)}catch{delete mem[st+k]}};
const blank=()=>({whitelist:[],staff:[],accounts:{},records:[],violations:[]});
const live=d=>{d.violations=d.violations||[];d.staff=d.staff||[];const now=Date.now();d.records.forEach(r=>{r.baseStatus=r.status;if(r.expiry&&r.status!=="Revoked"&&new Date(r.expiry+"T23:59:59")<now)r.status="Expired"});return d};
const load=()=>{try{const d=JSON.parse(sget("localStorage",K));return d&&d.records?live(d):blank()}catch{return blank()}};
const save=d=>{const c=JSON.parse(JSON.stringify(d));c.records.forEach(r=>{if(r.status==="Expired"&&r.baseStatus&&r.baseStatus!=="Expired")r.status=r.baseStatus;delete r.baseStatus});sset("localStorage",K,JSON.stringify(c))};
const sess=()=>{try{return JSON.parse(sget("sessionStorage",S))}catch{return null}};
const setSess=v=>v?sset("sessionStorage",S,JSON.stringify(v)):sdel("sessionStorage",S);

const norm=s=>s.trim().toUpperCase().replace(/\s+/g,"");

 $("#go").onclick=()=>run();$$("#f input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")run()});const run=async()=>{const u=$("#u").value.trim(),p=$("#p").value,btn=$("#go");

let suMode="licensee";
function signup(){
 const st=suMode==="staff";
 view(`<div class="auth"><div class="box glass in" id="f">
 <img class="logo" src="${LOGO}" alt="" style="width:84px;height:84px">
 <h1>Create ${st?"staff":"licensee"} account</h1><p class="sub">${st?"Your Gmail must be approved by the administrator":"Use your Gmail and your driver’s license number"}</p>
 <div class="glass tabs" style="width:100%;margin-bottom:16px"><button style="flex:1" id="m1" class="${st?"":"on"}">Licensee</button><button style="flex:1" id="m2" class="${st?"on":""}">Staff</button></div>
 ${fld("e","Gmail address","email",'autocomplete="email"')}
 ${st?"":fld("l","License number (DLXXX-XX-XXX)","text",'autocapitalize="characters"')}
 ${fld("p1","Create password (min. 8 characters)","password",'autocomplete="new-password"')}
 ${fld("p2","Confirm password","password",'autocomplete="new-password"')}
 <div class="err" id="err"></div>
 <button class="btn full" id="go">Create account</button>
 <div class="sw">Already have an account? <a id="bk">Sign in</a></div></div></div>`);
 eyes();$("#bk").onclick=()=>{screen="login";render()};
 $("#m1").onclick=()=>{suMode="licensee";signup()};$("#m2").onclick=()=>{suMode="staff";signup()};
 $("#go").onclick=()=>run();$$("#f input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")run()});const run=async()=>{
  const em=$("#e").value.trim().toLowerCase(),ln=st?"":norm($("#l").value),p1=$("#p1").value;
  if(!isGmail(em))return fail("Enter a valid @gmail.com address.");
  if(!st&&!/^DL[A-Z0-9]{3}-[A-Z0-9]{2}-[A-Z0-9]{3}$/.test(ln))return fail("License number must look like DLXXX-XX-XXX.");
  if(p1.length<8)return fail("Password must be at least 8 characters.");
  if(p1!==$("#p2").value)return fail("Passwords do not match.");
  const d=load();
  if(d.accounts[em])return fail("An account with this Gmail already exists.");
  if(st&&!d.staff.includes(em))return fail("This Gmail is not approved for staff access. Ask the administrator.");
  const rec=st?null:d.records.find(r=>norm(r.licenseNo||"")===ln);
  if(rec&&rec.email&&rec.email!==em)return fail("This license number is already linked to another account.");
  const btn=$("#go");btn.disabled=true;btn.textContent="Creating…";await wait(500);
  d.accounts[em]={hash:await hash(p1),role:st?"staff":"licensee",created:new Date().toISOString()};
  if(!st){if(!d.whitelist.includes(em))d.whitelist.push(em); // auto-whitelist
   if(rec)rec.email=em;else d.records.push({id:Date.now(),email:em,name:"",licenseNo:$("#l").value.trim().toUpperCase(),type:"",age:"",restr:[],issued:"",expiry:"",status:"Pending"})}
  save(d);setSess({role:st?"staff":"licensee",email:em});screen="login";toast("Account created. Welcome!");render()}}

 ${d.whitelist.length?T(["Gmail","Account",""],d.whitelist.map(e=>[esc(e),`<span class="pill ${d.accounts[e]?"Active":""}">${d.accounts[e]?"Created":"Not yet"}</span>`,`<button class="btn red sm" data-r="${esc(e)}">Remove</button>`])):'<div class="empty">Whitelist is empty.</div>'}</div>`;
 $("#sa").onclick=()=>{const e=$("#se").value.trim().toLowerCase();if(!isGmail(e))return toast("Enter a valid @gmail.com address");const x=load();if(x.staff.includes(e))return toast("Already on the staff list");x.staff.push(e);save(x);toast("Staff added");admin()};
 $$("[data-s]").forEach(b=>b.onclick=()=>{if(!confirm("Revoke staff access for "+b.dataset.s+"?"))return;const x=load();x.staff=x.staff.filter(y=>y!==b.dataset.s);if(x.accounts[b.dataset.s]&&x.accounts[b.dataset.s].role==="staff")delete x.accounts[b.dataset.s];save(x);toast("Access revoked");admin()});
 $("#ad").onclick=()=>{const e=$("#ne").value.trim().toLowerCase();if(!isGmail(e))return toast("Enter a valid @gmail.com address");const x=load();if(!x.whitelist.includes(e))x.whitelist.push(e);save(x);toast("Added");admin()};
 $$("[data-r]").forEach(b=>b.onclick=()=>{if(!confirm("Remove "+b.dataset.r+"?"))return;const x=load();x.whitelist=x.whitelist.filter(y=>y!==b.dataset.r);delete x.accounts[b.dataset.r];save(x);toast("Removed");admin()})}

render();
(()=>{const s=$("#splash");if(!s)return;$("img",s).src=LOGO;
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){s.remove();return}
 let done=false;const end=()=>{if(done)return;done=true;s.classList.add("out");setTimeout(()=>s.remove(),1000)};
 const pe=$("#sxp"),me=$("#sxm"),t0=performance.now(),M=["INITIALIZING SYSTEM","SECURING RECORDS","READY"];
 const tick=n=>{if(done)return;const p=Math.max(0,Math.min(1,(n-t0-900)/2600)),e=1-Math.pow(1-p,2.2),v=Math.round(e*100);pe.textContent=v;me.textContent=M[v<40?0:v<85?1:2];if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);
 setTimeout(end,4000);s.onclick=end})();
</script>
